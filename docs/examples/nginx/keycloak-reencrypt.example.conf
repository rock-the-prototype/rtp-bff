# EXAMPLE ONLY — public-safe documentation, not production configuration.
# Goal: TLS re-encrypt to Keycloak with explicit public path exposure.
# All names, addresses and certificate paths are fictitious.
#
# Each proxied location below assumes the contents of
# `trusted-xforwarded-headers.example.inc` are installed as:
# /etc/nginx/snippets/rtp-trusted-xforwarded-headers.conf

upstream keycloak_example_backend {
    server keycloak-backend.example.invalid:8443;
}

server {
    listen 443 ssl;
    server_name id.example.invalid;

    ssl_certificate     /etc/nginx/example/public.crt;
    ssl_certificate_key /etc/nginx/example/public.key;

    location ^~ /admin/ {
        return 404;
    }

    location ^~ /realms/master/ {
        return 404;
    }

    location ^~ /realms/ {
        proxy_pass https://keycloak_example_backend;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/rtp-trusted-xforwarded-headers.conf;

        proxy_ssl_server_name on;
        proxy_ssl_name keycloak-backend.example.invalid;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/nginx/example/internal-ca.crt;
    }

    location ^~ /resources/ {
        proxy_pass https://keycloak_example_backend;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/rtp-trusted-xforwarded-headers.conf;

        proxy_ssl_server_name on;
        proxy_ssl_name keycloak-backend.example.invalid;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/nginx/example/internal-ca.crt;
    }

    location ^~ /.well-known/ {
        proxy_pass https://keycloak_example_backend;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/rtp-trusted-xforwarded-headers.conf;

        proxy_ssl_server_name on;
        proxy_ssl_name keycloak-backend.example.invalid;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/nginx/example/internal-ca.crt;
    }

    # Default deny. Port 9000 is not part of this public server at all.
    location / {
        return 404;
    }
}
