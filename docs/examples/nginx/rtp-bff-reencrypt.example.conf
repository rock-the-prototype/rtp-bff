I# EXAMPLE ONLY — public-safe documentation, not production configuration.
# Goal: TLS re-encrypt to rtp-bff.
# The BFF MUST independently enforce all application security controls.
#
# Each proxied location assumes `trusted-xforwarded-headers.example.inc`
# is installed as /etc/nginx/snippets/rtp-trusted-xforwarded-headers.conf.

upstream rtp_bff_example_backend {
    server rtp-bff-backend.example.invalid:3443;
}

server {
    listen 443 ssl;
    server_name app.example.invalid;

    ssl_certificate     /etc/nginx/example/public.crt;
    ssl_certificate_key /etc/nginx/example/public.key;

    location = /auth/login {
        proxy_pass https://rtp_bff_example_backend;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        include /etc/nginx/snippets/rtp-trusted-xforwarded-headers.conf;
        proxy_ssl_server_name on;
        proxy_ssl_name rtp-bff-backend.example.invalid;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/example/internal-ca.crt;
    }

    location = /auth/callback {
        proxy_pass https://rtp_bff_example_backend;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        include /etc/nginx/snippets/rtp-trusted-xforwarded-headers.conf;
        proxy_ssl_server_name on;
        proxy_ssl_name rtp-bff-backend.example.invalid;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/example/internal-ca.crt;
    }

    location = /auth/session {
        proxy_pass https://rtp_bff_example_backend;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        include /etc/nginx/snippets/rtp-trusted-xforwarded-headers.conf;
        proxy_ssl_server_name on;
        proxy_ssl_name rtp-bff-backend.example.invalid;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/example/internal-ca.crt;
    }

    # Future controlled resource-proxy namespace.
    # BFF route policy remains default-deny even though ingress forwards /api/.
    location ^~ /api/ {
        proxy_pass https://rtp_bff_example_backend;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        include /etc/nginx/snippets/rtp-trusted-xforwarded-headers.conf;
        proxy_ssl_server_name on;
        proxy_ssl_name rtp-bff-backend.example.invalid;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/example/internal-ca.crt;
    }

    # /health and all unspecified routes stay private/not exposed.
    location / {
        return 404;
    }
}
