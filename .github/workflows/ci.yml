name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality gates
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 \
            --profile default \
            --component rustfmt \
            --component clippy
          rustup override set 1.98.1

      - name: Verify formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Run Redis-backed session integration tests
        env:
          RTP_REDIS_INTEGRATION_URL: redis://127.0.0.1:6379/
        run: cargo test --locked redis_backed_ -- --ignored --test-threads=1

      - name: Build
        run: cargo build --locked
