[package]
name = "rtp-bff"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.9"
axum-extra = { version = "=0.12.6", default-features = false, features = ["cookie"] }
axum-governor = { version = "=2.1.0", default-features = false, features = ["dashmap"] }
ipnet = "=2.12.2"
openidconnect = { version = "=4.0.1", features = ["timing-resistant-secret-traits"] }
redis = { version = "=1.7.0", default-features = false, features = ["tokio-comp", "connection-manager"] }
sha2 = "=0.10.9"
time = "=0.3.55"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
subtle = "=2.6.1"

[dev-dependencies]
p256 = "=0.13.2"
serde_json = "=1.0.151"
tower = { version = "=0.5.3", features = ["util"] }