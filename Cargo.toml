[package]
name = "rtp-bff"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.9"
openidconnect = { version = "=4.0.1", features = ["timing-resistant-secret-traits"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
